name: Build, check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploying runs share one group, so they go out one at a time and a run that
# has started is never cancelled. Pull request runs do not deploy; each pull
# request has its own group and a newer push replaces its older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check the built page
        run: npm test
      # The smoke test runs headless, which needs only Chromium's headless
      # shell and the system libraries it links against.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps --only-shell chromium
      - name: Smoke-test the built page in Chromium
        run: npm run test:smoke
      - name: Upload the build as a Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  check-live:
    name: Check the live page
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The checks have no dependencies, so there is nothing to install. The
      # published page can lag the deploy for a moment, hence the retries.
      - name: Check the live page
        env:
          CHECK_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm test; then
              exit 0
            fi
            echo "Live page check failed (attempt $attempt of 6)."
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          exit 1
