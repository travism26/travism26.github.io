<style>
  /* Loader fallback */
  #boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--p-ink, #0a0f0c);
    color: var(--p-accent, #22c55e);
    font-family: "JetBrains Mono", monospace; font-size: 13px;
    z-index: 999;
  }
  #boot.hide { display: none; }
</style>
</head>
<body>
  <div id="boot">$ booting portfolio…</div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="portfolio.jsx"></script>

  <script>
    // hide the boot splash once React mounts
    const obs = new MutationObserver(() => {
      if (document.querySelector("#root .nav")) {
        document.getElementById("boot").classList.add("hide");
        obs.disconnect();
      }
    });
    obs.observe(document.getElementById("root"), { childList: true, subtree: true });
  </script>
